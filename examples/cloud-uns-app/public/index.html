<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UNS Orders</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow">TIER0 CLOUD · UNS</p><h1 data-i18n="title">工单数据</h1></div>
        <div class="tools">
          <select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select>
          <button id="theme" type="button" data-i18n="theme">切换主题</button>
        </div>
      </header>
      <p id="app-name"></p>
      <section aria-labelledby="create-heading">
        <h2 id="create-heading" data-i18n="create">新增工单</h2>
        <form id="order-form">
          <label><span data-i18n="orderNo">工单号</span><input name="orderNo" required maxlength="64" pattern="[A-Za-z0-9_-]+" autocomplete="off" /></label>
          <label><span data-i18n="amount">金额（分）</span><input name="amount" required type="number" min="0" max="9007199254740991" step="1" /></label>
          <button id="save" type="submit" disabled data-i18n="save">保存</button>
        </form>
        <p id="write-state" class="muted"></p>
      </section>
      <section aria-labelledby="list-heading">
        <div class="list-heading"><h2 id="list-heading" data-i18n="records">工单列表</h2><button id="refresh" type="button" data-i18n="refresh">刷新列表</button></div>
        <p id="status" role="status" aria-live="polite"></p>
        <div class="table-wrap"><table><thead><tr><th data-i18n="orderNo">工单号</th><th data-i18n="amount">金额（分）</th><th data-i18n="state">状态</th><th data-i18n="revision">版本</th></tr></thead><tbody id="records"></tbody></table></div>
      </section>
    </main>
  </body>
</html>
